name: relay-collector-dryrun
# 交接前試跑：把 handoff/patches/relay-official-collector.patch 套到公開中繼的 main，在 GitHub 上實際跑一次收集＋整理套件，
# 但不推送任何東西（不碰中繼 repo、不連網站）。只印出套件清單（檔名、大小、失敗項目）。
on:
  workflow_dispatch:
    inputs:
      sessions:
        default: '5'
      statistics:
        default: 'auto'
      patch:
        description: 'handoff/patches 裡要套到中繼 main 上試跑的 patch 檔名'
        default: 'relay-collector-retry.patch'
      keep:
        description: 'true = 把套件（官方公開資料）存進 gate-probe results/official-import-dryrun/ 供 Claude 用網站驗證程式離線核對'
        default: 'false'
permissions:
  contents: write
jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: probe
      - uses: actions/checkout@v4
        with:
          repository: wcr0936531039-png/macro-relay-service
          ref: main
          path: relay
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply relay patch
        working-directory: relay
        run: |
          case "${{ inputs.patch }}" in *[!A-Za-z0-9._-]*|"") echo "bad patch name"; exit 1;; esac
          git -c user.name=dryrun -c user.email=dryrun@example.invalid am "$GITHUB_WORKSPACE/probe/handoff/patches/${{ inputs.patch }}"
      - name: Unit tests
        working-directory: relay
        run: python -m unittest discover -s tests -v
      - name: Collect and build bundle (no push)
        working-directory: relay
        run: scripts/run_official_collector.sh "$RUNNER_TEMP/official" "${{ inputs.sessions }}" "${{ inputs.statistics }}"
      - name: Bundle summary
        if: always()
        run: |
          m="$RUNNER_TEMP/official/bundle/manifest.json"
          python -c "import json,sys;m=json.load(open(sys.argv[1]));print('BUNDLE',m['generatedAt'],m['window']);print('CARRIED',m.get('carried'),'|',m.get('carryNote'));[print('PART',p['kind'],p['name'],p['bytes']) for p in m['parts']];print('ERRORS',len(m['errors']));[print('ERR',e['source'],'|',e['error'][:300]) for e in m['errors']]" "$m"
          du -sh "$RUNNER_TEMP/official/bundle"
      - name: Keep bundle for offline validation
        if: ${{ inputs.keep == 'true' }}
        working-directory: probe
        run: |
          rm -rf results/official-import-dryrun && mkdir -p results/official-import-dryrun
          cp "$RUNNER_TEMP/official/bundle/"* results/official-import-dryrun/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/official-import-dryrun
          git commit -qm "official-import dry-run bundle ${GITHUB_RUN_ID}"
          for n in 1 2 3; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 5; done
