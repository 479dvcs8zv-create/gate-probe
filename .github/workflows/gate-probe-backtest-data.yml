name: gate-probe-backtest-data
# 下載回測用的官方資料（加權指數、FRED 美元指數），原始回應與整理後 CSV 存進 results/backtest-data/。
on:
  workflow_dispatch:
    inputs:
      start_year:
        description: 起始年
        required: true
        default: '2006'
permissions:
  contents: write
concurrency:
  group: gate-probe-backtest-data
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build dataset
        env:
          START_YEAR: ${{ inputs.start_year }}
        run: python3 tools/build_taiex_usd_dataset.py "results/backtest-data/taiex-usd-${GITHUB_RUN_ID}" "$START_YEAR" results/backtest-data/twse-cache
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/backtest-data
          git commit -m "backtest data taiex+usd run ${GITHUB_RUN_ID}" || exit 0
          for n in 1 2 3; do
            if git pull --rebase -q && git push -q; then exit 0; fi
            sleep 5
          done
          exit 1
