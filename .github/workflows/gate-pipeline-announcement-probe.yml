# gate_pipeline v4.9 announcement probe -- dedicated probe repository.
#
# Single self-contained file. Embedded below as base64: the four ORIGINAL v4.8 program files
# (unchanged) and ops/announcement_probe.py (v4.9). At run time they are restored and checked
# against their SHA-256; if any byte differs the job stops before probing.
#
# What it does: sends real queries to the MOPS material-information endpoint
# (mopsov.twse.com.tw /mops/web/ajax_t05st01) for one company and saves the exact request
# and response bytes, plus one Wayback end-to-end check. 3-second pause between requests.
#
# - Runs when this file is pushed to main, and from the "Run workflow" button.
# - Read-only permissions; produces a report and an artifact only; never writes to the repo.
# - No secrets or API keys are used or needed.
name: gate-pipeline-announcement-probe

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/gate-pipeline-announcement-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gate-pipeline-announcement-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

