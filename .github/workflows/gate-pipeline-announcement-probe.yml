      - name: Verify restored files (SHA-256; v4.8 originals + v4.9 announcement probe)
        working-directory: gate_pipeline_probe
        run: |
          cat > MANIFEST.sha256 <<'MANIFEST'
          dec360badfbfb035dcb8700ec557fe7c6304596e8825c6524a75ea1bc0115cdf  reject_codes.py
          07d6446c6aefb83035f5f6f6c6d4cbb9256de10ca6f865a8629fbecfed576e4d  time_utils.py
          b978576ca506b33d0f682f6936c69405634468a90809aeeef318040e9e9bf06c  independent_verifier.py
          3de5f9c9fd66e97cefd02dd6c91d8efc2483402016e4258434c7366f981b1645  ops/network_probe.py
          703d77929ef3d632bab0f642cc418a010be53016bfef05e86e20c841e8ac0ba7  ops/announcement_probe.py
          MANIFEST
          sha256sum --strict -c MANIFEST.sha256

      - name: Run announcement probe
        working-directory: gate_pipeline_probe
        # Company 2330, ROC year 115 (= 2026): July, August, and the full year.
        # Extra GET: Wayback CDX listing of the t05st01 page since 2025 (to see how the URL is recorded).
        # Wayback end-to-end check on the t05st01 page with cutoff 2026-01-01.
        run: |
          python ops/announcement_probe.py --co-id 2330 --roc-year 115 \
            --month 07 --month 08 --full-year \
            --url "https://web.archive.org/cdx/search/cdx?url=mopsov.twse.com.tw/mops/web/t05st01&output=json&from=2025&limit=5" \
            --wayback-check "https://mopsov.twse.com.tw/mops/web/t05st01" \
            --cutoff "2026-01-01T00:00:00+08:00" \
            --timeout 30 \
            --out-dir probe_out

      - name: Summarize to job log and step summary
        if: always()
        working-directory: gate_pipeline_probe
        run: |
          python - <<'PY'
          import json, os
          p = "probe_out/probe_report.json"
          if not os.path.exists(p):
              print("probe_report.json was not produced")
              raise SystemExit(0)
          r = json.load(open(p, encoding="utf-8"))
          rows = ["| request | status | bytes | body sha256 (16) | strict utf-8 | error |",
                  "|---|---|---|---|---|---|"]
          for t in r.get("targets", []):
              cs = (t.get("charset") or {}).get("strict_decode", {})
              rows.append("| GET %s | %s | %s | %s | %s | %s |" % (t["url"].replace("|", "/"), t.get("status"),
                          t.get("content_length"), (t.get("body_sha256") or "")[:16], cs.get("utf-8", ""), t.get("error") or ""))
          for q in r.get("queries", []):
              cs = (q.get("charset") or {}).get("strict_decode", {})
              rows.append("| POST t05st01 %s | %s | %s | %s | %s | %s |" % (json.dumps(q["params"], ensure_ascii=False).replace("|", "/"),
                          q.get("status"), q.get("content_length"), (q.get("body_sha256") or "")[:16], cs.get("utf-8", ""), q.get("error") or ""))
          for w in r.get("wayback_checks", []):
              rows += ["", "**Wayback end-to-end** %s: %s %s %s" % (w.get("source_url"), w.get("result"), w.get("snapshot_id", ""), w.get("error", ""))]
          env = r["environment"]
          rows += ["", "probe_version=%s run_id=%s sha=%s runner=%s" % (r.get("probe_version"),
              env.get("github_run_id"), env.get("github_sha"), env.get("runner_environment"))]
          text = "\n".join(rows)
          print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## gate_pipeline v4.9 announcement probe\n\n" + text + "\n")
          PY
          echo "----- probe_report.json (full) -----"
          cat probe_out/probe_report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gate-pipeline-announcement-probe-${{ github.run_id }}
          path: gate_pipeline_probe/probe_out/
          if-no-files-found: warn
          retention-days: 14
