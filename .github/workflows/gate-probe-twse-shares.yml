name: gate-probe-twse-shares
# 投本比回測用：證交所上市普通股每月第一個交易日的發行股數（MI_QFIIS，唯讀 GET、每次間隔 4 秒、可分次接續）。不使用任何金鑰。
# 只寫入 gate-probe 的 results/backtest-data/shares/。
on:
  workflow_dispatch:
    inputs:
      start:
        description: 起月 YYYY-MM
        required: true
        default: '2012-05'
      end:
        description: 迄月 YYYY-MM
        required: true
        default: '2026-12'
      minutes:
        description: 本次最多執行分鐘數（上限 120）
        required: true
        default: '60'
permissions:
  contents: write
concurrency:
  group: gate-probe-twse-shares
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          MINUTES: ${{ inputs.minutes }}
        run: |
          case "$START$END" in *[!0-9-]*) echo "bad month"; exit 1;; esac
          case "$MINUTES" in *[!0-9]*|"") echo "bad minutes"; exit 1;; esac
          [ "$MINUTES" -le 120 ] || MINUTES=120
          python3 -I tools/build_twse_shares.py results/backtest-data/shares "$START" "$END" "$MINUTES" results/backtest-data/twse-cache
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/backtest-data/shares
          git commit -m "twse shares ${{ inputs.start }}..${{ inputs.end }} run ${GITHUB_RUN_ID}" || exit 0
          for n in 1 2 3 4 5 6; do
            if git pull --rebase -q && git push -q; then exit 0; fi
            sleep 15
          done
          exit 1
