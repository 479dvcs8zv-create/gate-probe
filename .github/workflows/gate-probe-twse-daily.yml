name: gate-probe-twse-daily
# 回測用證交所每日資料（上市漲跌家數、電子類指數漲跌、當沖占比）。唯讀 GET、每次間隔 4 秒、可分次接續。
# 不使用任何金鑰；只寫入 gate-probe 的 results/backtest-data/twse-daily/。
on:
  workflow_dispatch:
    inputs:
      start:
        description: 起日 YYYY-MM-DD
        required: true
        default: '2006-01-01'
      end:
        description: 迄日 YYYY-MM-DD
        required: true
        default: '2026-12-31'
      minutes:
        description: 本次最多執行分鐘數（上限 320）
        required: true
        default: '320'
      kind:
        description: daily＝每日漲跌家數；daytrade＝當沖占比月表；exrights＝除權除息計算結果表（寫入 stock-prices）
        required: true
        default: daily
permissions:
  contents: write
concurrency:
  group: gate-probe-twse-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        env:
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          MINUTES: ${{ inputs.minutes }}
          KIND: ${{ inputs.kind }}
        run: |
          case "$START$END" in *[!0-9-]*) echo "bad date"; exit 1;; esac
          case "$MINUTES" in *[!0-9]*|"") echo "bad minutes"; exit 1;; esac
          [ "$MINUTES" -le 320 ] || MINUTES=320
          if [ "$KIND" = exrights ]; then
            python3 -I tools/build_twse_exrights.py results/backtest-data/stock-prices "${START%%-*}" "${END%%-*}"
          elif [ "$KIND" = daytrade ]; then
            python3 -I tools/build_twse_daytrade.py results/backtest-data/twse-daily results/backtest-data/twse-cache
          else
            python3 -I tools/build_twse_daily.py results/backtest-data/twse-daily "$START" "$END" "$MINUTES" results/backtest-data/twse-cache
          fi
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/backtest-data/twse-daily
          if [ -f results/backtest-data/stock-prices/twse-exrights.csv ]; then git add results/backtest-data/stock-prices/twse-exrights.csv results/backtest-data/stock-prices/twse-exrights-files.csv; fi
          git commit -m "twse daily ${{ inputs.start }}..${{ inputs.end }} run ${GITHUB_RUN_ID}" || exit 0
          for n in 1 2 3 4 5; do
            if git pull --rebase -q && git push -q; then exit 0; fi
            sleep 10
          done
          exit 1
