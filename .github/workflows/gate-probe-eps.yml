name: gate-probe-eps
# 第 37 輪回測用：公開資訊觀測站綜合損益表彙總（t163sb04）每季每股盈餘，全部上市／上櫃公司。唯讀 GET、間隔 4 秒、可接續。不使用任何金鑰。
on:
  workflow_dispatch:
    inputs:
      start_roc_year:
        description: 起始民國年
        required: true
        default: '102'
      end_roc_year:
        description: 結束民國年
        required: true
        default: '115'
permissions:
  contents: write
concurrency:
  group: gate-probe-eps
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        env:
          Y0: ${{ inputs.start_roc_year }}
          Y1: ${{ inputs.end_roc_year }}
        run: |
          case "$Y0$Y1" in *[!0-9]*|"") echo "bad input"; exit 1;; esac
          python3 -I tools/build_eps_dataset.py results/backtest-data/eps "$Y0" "$Y1"
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/backtest-data/eps
          git commit -m "eps statements ${{ inputs.start_roc_year }}..${{ inputs.end_roc_year }} run ${GITHUB_RUN_ID}" || exit 0
          for n in 1 2 3 4 5 6; do
            if git pull --rebase -q && git push -q; then exit 0; fi
            sleep 15
          done
          exit 1
